name: Close inactive issues and PRs
on:
  workflow_dispatch:
    inputs:
      inactive_days:
        description: Close items with no activity for more than N days
        required: false
        default: '90'
      dry_run:
        description: If true, only print URLs (no comment/close)
        required: false
        default: true
permissions:
  issues: write
  pull-requests: write
env:
  DEFAULT_INACTIVE_DAYS: '90'
  DEFAULT_DRY_RUN: false
jobs:
  close_inactive:
    if: github.repository == 'agent0ai/agent-zero' && github.ref == format('refs/heads/{0}',
      github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
    - name: Find and optionally close inactive issues/PRs
      uses: actions/github-script@v7
      env:
        INACTIVE_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.inactive_days
          || env.DEFAULT_INACTIVE_DAYS }}
        DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run ||
          env.DEFAULT_DRY_RUN }}
      with:
        script: "const inactiveDaysRaw = process.env.INACTIVE_DAYS ?? \"90\";\nconst\
          \ inactiveDays = Number.parseInt(inactiveDaysRaw, 10);\nif (!Number.isFinite(inactiveDays)\
          \ || inactiveDays <= 0) {\n  core.setFailed(`Invalid INACTIVE_DAYS: ${inactiveDaysRaw}`);\n\
          \  return;\n}\n\nconst dryRunRaw = (process.env.DRY_RUN ?? \"true\").toLowerCase();\n\
          const dryRun = [\"1\", \"true\", \"yes\", \"y\"].includes(dryRunRaw);\n\n\
          const now = new Date();\nconst cutoff = new Date(now.getTime() - inactiveDays\
          \ * 24 * 60 * 60 * 1000);\nconst cutoffDate = cutoff.toISOString().slice(0,\
          \ 10);\n\ncore.info(`inactiveDays=${inactiveDays}`);\ncore.info(`dryRun=${dryRun}`);\n\
          core.info(`cutoffDate=${cutoffDate}`);\n\nconst owner = context.repo.owner;\n\
          const repo = context.repo.repo;\n\nasync function processQuery(kind, searchQuery)\
          \ {\n  core.info(`Searching ${kind}: ${searchQuery}`);\n\n  const items\
          \ = await github.paginate(github.rest.search.issuesAndPullRequests, {\n\
          \    q: searchQuery,\n    per_page: 100,\n  });\n\n  if (items.length ===\
          \ 0) {\n    core.info(`No inactive ${kind} found.`);\n    return;\n  }\n\
          \n  core.info(`Found ${items.length} inactive ${kind}. URLs:`);\n  for (const\
          \ item of items) {\n    core.info(item.html_url);\n  }\n\n  if (dryRun)\
          \ {\n    return;\n  }\n\n  for (const item of items) {\n    const issueNumber\
          \ = item.number;\n    const url = item.html_url;\n\n    try {\n      await\
          \ github.rest.issues.createComment({\n        owner,\n        repo,\n  \
          \      issue_number: issueNumber,\n        body: `Closing due to inactivity\
          \ of ${inactiveDays} days.`,\n      });\n\n      await github.rest.issues.update({\n\
          \        owner,\n        repo,\n        issue_number: issueNumber,\n   \
          \     state: \"closed\",\n      });\n\n      core.info(`Closed: ${url}`);\n\
          \    } catch (err) {\n      core.warning(`Failed to close ${url}: ${err?.message\
          \ ?? String(err)}`);\n    }\n  }\n}\n\nconst base = `repo:${owner}/${repo}\
          \ is:open updated:<${cutoffDate} sort:updated-asc`;\nawait processQuery(\"\
          issues\", `${base} is:issue`);\nawait processQuery(\"pull requests\", `${base}\
          \ is:pr`);\n"
